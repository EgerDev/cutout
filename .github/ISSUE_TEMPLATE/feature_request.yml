name: Feature request
description: Suggest something Cutout should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. Cutout processes images on the device; ideas that need a server to see the photo are out of scope.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
